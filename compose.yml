services:
  backend:
    image: reflex:backend
    container_name: backend
    restart: unless-stopped
    hostname: backend
    ports:
     - 8080:8080
    extra_hosts:
      - "db.local:192.168.98.22"
    environment:
      - BACKEND_PORT=8080
      - ECHO=false
      - ECHO_POOL=false
      - LOGLEVEL=info
      - LOG_LEVEL=info
  frontend:
    image: reflex:frontend
    container_name: frontend
    restart: unless-stopped
    hostname: frontend
    ports:
      - 3000:80
    depends_on:
      - backend
    extra_hosts:
      - "db.local:192.168.98.22"
    environment:
      - BACKEND_PORT=8080
      - FRONTEND_PORT=3000
      - ECHO=false
      - ECHO_POOL=false
